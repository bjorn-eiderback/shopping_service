server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
    kubernetes:
      discovery:
        all-namespaces: false
        service-name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  info:
    title: Gateway Service API
    version: v1
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: ${OPENAPI_USER_URL:http://localhost:8081/v3/api-docs}
      - name: catalog-service
        url: ${OPENAPI_CATALOG_URL:http://localhost:8082/v3/api-docs}
      - name: order-service
        url: ${OPENAPI_ORDER_URL:http://localhost:8083/v3/api-docs}

auth:
  provider: ${AUTH_PROVIDER:none}
  enabled: ${AUTH_ENABLED:false}
  roles-claim: ${AUTH_ROLES_CLAIM:${AUTH0_ROLES_CLAIM:https://example.com/roles}}
  role-prefix: ROLE_
  auth0:
    issuer-uri: ${AUTH0_ISSUER_URI:}
    audience: ${AUTH0_AUDIENCE:}
  local:
    issuer-uri: ${LOCAL_OAUTH2_ISSUER_URI:http://localhost:9000}
    audience: ${LOCAL_OAUTH2_AUDIENCE:shopping-api}
  dev-basic:
    enabled: ${AUTH_DEV_BASIC_ENABLED:true}
    admin-username: ${AUTH_DEV_ADMIN_USERNAME:adminAPI}
    admin-password: ${AUTH_DEV_ADMIN_PASSWORD:admin}
    user-username: ${AUTH_DEV_USER_USERNAME:userAPI}
    user-password: ${AUTH_DEV_USER_PASSWORD:user}

---
spring:
  config:
    activate:
      on-profile: stage
springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: ${OPENAPI_USER_URL:http://user-service:8081/v3/api-docs}
      - name: catalog-service
        url: ${OPENAPI_CATALOG_URL:http://catalog-service:8082/v3/api-docs}
      - name: order-service
        url: ${OPENAPI_ORDER_URL:http://order-service:8083/v3/api-docs}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: ${OPENAPI_USER_URL:http://user-service:8081/v3/api-docs}
      - name: catalog-service
        url: ${OPENAPI_CATALOG_URL:http://catalog-service:8082/v3/api-docs}
      - name: order-service
        url: ${OPENAPI_ORDER_URL:http://order-service:8083/v3/api-docs}
