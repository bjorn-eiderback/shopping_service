server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
    kubernetes:
      discovery:
        all-namespaces: false
        service-name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  info:
    title: Gateway Service API
    version: v1
