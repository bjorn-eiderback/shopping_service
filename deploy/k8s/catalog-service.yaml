apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: shopping/catalog-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://catalog-mongo:27017/catalog
            - name: AUDIT_BASE_URL
              value: http://audit-service:8084
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: shopping
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8082
      targetPort: 8082
