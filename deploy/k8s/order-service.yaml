apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: shopping/order-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://orders-postgres:5432/orders
            - name: SPRING_DATASOURCE_USERNAME
              value: orders
            - name: SPRING_DATASOURCE_PASSWORD
              value: orders
            - name: AUDIT_BASE_URL
              value: http://audit-service:8084
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopping
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083
