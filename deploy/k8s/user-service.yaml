apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: shopping/user-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://users-postgres:5432/users
            - name: SPRING_DATASOURCE_USERNAME
              value: users
            - name: SPRING_DATASOURCE_PASSWORD
              value: users
            - name: AUDIT_BASE_URL
              value: http://audit-service:8084
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopping
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
