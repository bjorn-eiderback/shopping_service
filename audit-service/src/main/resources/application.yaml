server:
  port: 8084

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5434/audit
    username: audit
    password: audit
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  info:
    title: Audit Service API
    version: v1
